services:
  postgres:
    image: postgres:16-alpine
    container_name: quiz-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quiz_app}
      POSTGRES_USER: ${POSTGRES_USER:-quizapp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizapp_dev_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-quizapp} -d ${POSTGRES_DB:-quiz_app}
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: ./quiz-app-server
      dockerfile: Dockerfile
    container_name: quiz-app-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_URL: postgres://${POSTGRES_USER:-quizapp}:${POSTGRES_PASSWORD:-quizapp_dev_password}@postgres:5432/${POSTGRES_DB:-quiz_app}
      SECRET: ${APP_SECRET:-change-me-in-production}
      LEADERSHIP_REGISTRATION_CODE: ${LEADERSHIP_REGISTRATION_CODE:-lead-123}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-20}
      MAX_UPLOAD_SIZE_MB: ${MAX_UPLOAD_SIZE_MB:-5}
    ports:
      - "${BACKEND_PORT:-5001}:5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1:5000/health >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./quiz-app-client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    container_name: quiz-app-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - wget -qO- http://127.0.0.1/ >/dev/null || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
  backend_uploads:
